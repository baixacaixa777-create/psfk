<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assinatura · Play Generator</title>
<style>
:root{--verde:#01875f;--verde-escuro:#016b4a;--txt:#202124;--cinza:#5f6368;--borda:#e8eaed;--bg:#f8f9fa;--amarelo:#f0d264;--amarelo-escuro:#7a5800}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
.topo{background:#fff;border-bottom:1px solid var(--borda)}
.topo-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{width:24px;height:24px}
.topo b{font-size:17px}
main{max-width:460px;width:100%;margin:0 auto;padding:40px 20px;flex:1}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:32px 24px;box-shadow:0 1px 2px rgba(60,64,67,.08)}
.lock{display:block;width:120px;height:120px;margin:0 auto 24px}
h2{font-size:20px;font-weight:600;margin:0 0 8px;text-align:center}
p.sub{text-align:center;color:var(--cinza);font-size:14px;margin:0 0 24px;line-height:1.5}
.dados{background:#fef7e0;border:1px solid #f0d264;border-radius:12px;padding:16px;margin-bottom:24px}
.dados b{display:block;font-size:13px;color:var(--amarelo-escuro);margin-bottom:6px}
.dados span{font-size:13.5px;color:var(--txt)}
.btn-whatsapp{width:100%;background:#25d366;color:#fff;border:none;padding:16px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-whatsapp:hover{background:#1ebe5f}
.btn-whatsapp svg{width:22px;height:22px}
.voltar{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--cinza);text-decoration:none}
.voltar:hover{color:var(--verde)}
.rodape{text-align:center;font-size:12px;color:var(--cinza);padding:18px}
</style>
</head>
<body>
<header class="topo"><div class="topo-in">
  <svg class="logo" viewBox="0 0 24 24"><path fill="#4285f4" d="M4.1 2.66c-.27.29-.42.73-.42 1.3v16.08c0 .57.15 1.01.42 1.3l.07.07L14.02 11.5v-.23L4.17 2.6l-.07.06z"/><path fill="#34a853" d="M17.32 14.82l-3.3-3.3v-.23l3.3-3.3.07.04 3.91 2.22c1.12.63 1.12 1.67 0 2.31l-3.91 2.22-.07.04z"/><path fill="#fbbc04" d="M17.39 14.78L14.02 11.4 4.1 21.34c.37.39.98.44 1.67.05l11.62-6.61"/><path fill="#ea4335" d="M17.39 8.02L5.77 1.41c-.69-.39-1.3-.34-1.67.05l9.92 9.94 3.37-3.38z"/></svg>
  <b>Play Generator</b>
</div></header>

<main>
  <div class="card">
    <img class="lock" src="https://cdn-icons-png.flaticon.com/512/6815/6815095.png" alt="cadeado" />
    <h2>Assinatura pendente</h2>
    <p class="sub" id="msg">Sua assinatura ainda está sendo confirmada pelo administrador. Enquanto isso, o acesso à ferramenta fica bloqueado.</p>
    <div class="dados">
      <b>E-mail: <span id="dadosEmail">—</span></b>
      <span id="lblPlano">Plano: <span id="dadosPlano">—</span></span>
    </div>
    <button class="btn-whatsapp" id="btnZap">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16"><path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"></path></svg>
      <span id="txtZap">Quero garantir minha assinatura</span>
    </button>
    <a class="voltar" href="/">Voltar para o login</a>
  </div>
</main>
<div class="rodape">Play Generator · páginas whitelabel</div>

<script>
const $ = (s) => document.querySelector(s);
const planoMap = { quinzenal: 'Quinzenal', mensal: 'Mensal', trimestral: 'Trimestral' };

(async () => {
  const r = await fetch('/api/auth');
  if (r.status === 401) { location.href = '/'; return; }
  const j = await r.json();
  const u = j.usuario;
  if (!u) { location.href = '/'; return; }
  $('#dadosEmail').textContent = u.email;
  $('#dadosPlano').textContent = planoMap[u.plano] || u.plano;

  const plano = planoMap[u.plano] || u.plano;
  const texto = encodeURIComponent('Olá! Quero garantir minha assinatura do plano ' + plano);
  $('#btnZap').onclick = () => {
    location.href = 'https://wa.me/447348503814?text=' + texto;
  };
})();
</script>
</body>
</html>
